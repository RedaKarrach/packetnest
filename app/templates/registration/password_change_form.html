{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Change password</h1>
  <p class="subtitle">Signed in as {{ user.username }}{% if user.profile %} · {{ user.profile.organisation.name }}{% endif %}</p>
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="button">Change password</button>
  </form>
</div>
{% endblock %}
